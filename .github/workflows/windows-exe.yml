# Fabrique DCS-Copilote pour Windows (.exe, sans Python à installer).
# - Pousser un tag « v1.2.3 » : construit, vérifie et publie le .zip dans les Releases du dépôt.
# - Onglet Actions → « Windows .exe » → Run workflow : construit le .zip (téléchargeable dans le run).
name: Windows .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # publier la Release

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # une commande par étape : la moindre erreur arrête la fabrication à l'endroit fautif
      - name: Mise à jour de pip
        run: python -m pip install --upgrade pip

      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller

      - name: Voix Piper
        run: python main.py --download-voice fr_FR-tom-medium

      - name: Icône
        run: python build/make_icon.py

      - name: Construction
        run: pyinstaller --noconfirm build/dcs-copilote.spec

      - name: Voix livrée avec l'appli
        run: Copy-Item -Recurse voices dist/DCS-Copilote/voices

      # l'appli compare ce numéro à la dernière Release pour proposer les mises à jour
      - name: Numéro de version
        if: startsWith(github.ref, 'refs/tags/')
        run: Set-Content -Path dist/DCS-Copilote/version.txt -Value $env:GITHUB_REF_NAME -Encoding utf8

      - name: Vérification (--selftest)
        working-directory: dist/DCS-Copilote
        run: |
          $p = Start-Process -FilePath .\DCS-Copilote.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.log -Encoding utf8
          Remove-Item selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Archive
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist/DCS-Copilote -DestinationPath "DCS-Copilote-$name-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: DCS-Copilote-windows
          path: DCS-Copilote-*-windows.zip
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: DCS-Copilote-*-windows.zip
          generate_release_notes: true
