# Fabrique DCS-Copilote pour Windows (.exe, sans Python à installer).
# - Pousser un tag « v1.2.3 » : construit, vérifie et publie le .zip dans les Releases du dépôt.
# - Onglet Actions → « Windows .exe » → Run workflow : construit le .zip (téléchargeable dans le run).
name: Windows .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # publier la Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Voix Piper et icône
        run: |
          python main.py --download-voice fr_FR-siwis-medium
          python build/make_icon.py

      - name: Construction
        run: pyinstaller --noconfirm build/dcs-copilote.spec

      - name: Voix livrée avec l'appli
        shell: pwsh
        run: Copy-Item -Recurse voices dist/DCS-Copilote/voices

      - name: Vérification (--selftest)
        shell: pwsh
        working-directory: dist/DCS-Copilote
        run: |
          $p = Start-Process -FilePath .\DCS-Copilote.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.log
          Remove-Item selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Archive
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist/DCS-Copilote -DestinationPath "DCS-Copilote-$name-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DCS-Copilote-windows
          path: DCS-Copilote-*-windows.zip
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DCS-Copilote-*-windows.zip
          generate_release_notes: true
