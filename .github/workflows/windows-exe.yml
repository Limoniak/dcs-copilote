# Fabrique DCS Copilote pour Windows : installeur Velopack (Setup.exe, mises à jour automatiques) et version
# portable (.zip), sans Python à installer.
# - Pousser un tag « v1.2.3 » : construit, vérifie, empaquette et publie la Release (que l'appli installée
#   détecte pour se mettre à jour).
# - Onglet Actions → « Windows .exe » → Run workflow : construit le tout (téléchargeable dans le run).
name: Windows .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # publier la Release

env:
  PYTHONUTF8: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # une commande par étape : la moindre erreur arrête la fabrication à l'endroit fautif
      - name: Mise à jour de pip
        run: python -m pip install --upgrade pip

      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller

      - name: Voix Piper
        run: python main.py --download-voice fr_FR-tom-medium

      - name: Icône
        run: python build/make_icon.py

      - name: Construction
        run: pyinstaller --noconfirm build/dcs-copilote.spec

      - name: Voix livrée avec l'appli
        run: Copy-Item -Recurse voices dist/DCS-Copilote/voices

      - name: Vérification (--selftest)
        working-directory: dist/DCS-Copilote
        run: |
          $p = Start-Process -FilePath .\DCS-Copilote.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.log -Encoding utf8
          Remove-Item selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      # Velopack : même version que la bibliothèque velopack de requirements.txt
      - name: Outil Velopack (vpk)
        run: |
          dotnet tool install -g vpk --version 1.2.161
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Numéro de version
        id: version
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "number=$v" >> $env:GITHUB_OUTPUT

      # version précédente : pour fabriquer une mise à jour différentielle (petit téléchargement)
      - name: Version précédente
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true      # première version Velopack : rien à télécharger
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Paquet Velopack
        run: >
          vpk pack --packId DCSCopilote --packVersion ${{ steps.version.outputs.number }}
          --packDir dist/DCS-Copilote --mainExe DCS-Copilote.exe
          --packTitle "DCS Copilote" --packAuthors Limoniak --icon build/icon.ico

      - uses: actions/upload-artifact@v7
        with:
          name: DCS-Copilote-windows
          path: Releases/*
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --publish --merge --releaseName ${{ github.ref_name }} --tag ${{ github.ref_name }}
